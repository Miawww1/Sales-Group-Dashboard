<script>
  /************************************************************
   *  AUTH.JS - Perbaikan Login & Transisi
   ************************************************************/

  // Inisialisasi elemen
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const loginForm = document.getElementById('loginFormElement');
  const regForm = document.getElementById('registerFormElement');

  // Switch Tab Logic
  if (tabLogin && tabRegister) {
    tabLogin.onclick = () => {
      tabLogin.classList.add('active'); tabRegister.classList.remove('active');
      loginForm.classList.remove('hidden'); regForm.classList.add('hidden');
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add('active'); tabLogin.classList.remove('active');
      regForm.classList.remove('hidden'); loginForm.classList.add('hidden');
    };
  }

  // Handle Login
  if (loginForm) {
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;

      toggleLoading(true, 'Memverifikasi Login...');

      runServer()
        .withSuccessHandler(res => {
          toggleLoading(false);
          if (res.success) {
            getState().user = res.user;
            sessionStorage.setItem('user', JSON.stringify(res.user));
            showDashboard(); // Panggil fungsi transisi
          } else {
            showToast(res.message, 'err');
          }
        })
        .withFailureHandler(err => {
          toggleLoading(false);
          showToast('Koneksi Gagal: ' + err, 'err');
        })
        .checkLogin(email, pass);
    };
  }

  // Handle Register
  if (regForm) {
    regForm.onsubmit = (e) => {
      e.preventDefault();
      toggleLoading(true, 'Mendaftarkan Akun...');
      
      const nama = document.getElementById('regNama').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;
      const jab = document.getElementById('regJabatan').value;
      const reg = document.getElementById('regRegional').value;

      runServer().withSuccessHandler(res => {
        toggleLoading(false);
        if(res.success) {
          showToast(res.message, 'ok');
          regForm.reset();
          tabLogin.click();
        } else {
          showToast(res.message, 'err');
        }
      }).registerUser(nama, email, pass, jab, reg);
    };
  }

  /**
   * FUNGSI KRUSIAL: Menampilkan Dashboard (Cegah Layar Putih)
   */
  function showDashboard() {
    const authBox = document.getElementById('authContainer');
    const dashBox = document.getElementById('dashboardContainer');
    const userDisplay = document.getElementById('userName');

    // 1. Sembunyikan Login, Tampilkan Dashboard
    if (authBox) authBox.classList.add('hidden');
    if (dashBox) dashBox.classList.remove('hidden');

    // 2. Set Nama User di Topbar
    const u = getState().user;
    if (userDisplay && u) {
      userDisplay.textContent = u.nama + ' (' + (u.regional || '') + ')';
    }

    // 3. Jalankan inisialisasi form (Estate, Sumber, dll)
    if (typeof initializeDashboard === 'function') {
      initializeDashboard();
    }
  }

  function logout() {
    if (confirm('Keluar dari aplikasi?')) {
      sessionStorage.clear();
      getState().user = null;
      
      // Kembalikan posisi tampilan ke menu awal
      document.getElementById('dashboardContainer').classList.add('hidden');
      if (typeof switchPage === 'function') switchPage('inputCard');
      
      document.getElementById('authContainer').classList.remove('hidden');
      if (loginForm) loginForm.reset();
      showToast('Anda telah logout', 'ok');
    }
  }

  function openForgotPassword() { document.getElementById('forgotModal').classList.remove('hidden'); }
  function closeForgotPassword() { document.getElementById('forgotModal').classList.add('hidden'); }

  // Auto-Login
  window.addEventListener('load', () => {
    const saved = sessionStorage.getItem('user');
    if (saved) {
      try {
        getState().user = JSON.parse(saved);
        showDashboard();
      } catch (e) { sessionStorage.removeItem('user'); }
    }
  });
</script>
