<script>
  /************************************************************
   *  CART.JS - Izinkan Harga 0 (Free)
   ************************************************************/

  function addItemToCart() {
    const estate = document.getElementById('estate').value;
    const produkSelect = document.getElementById('produkSelect');
    const hargaInput = document.getElementById('prodHarga');
    
    if (!estate) return showToast('Pilih Estate dahulu', 'err');
    if (!produkSelect.value) return showToast('Pilih Produk dahulu', 'err');

    const hargaNum = parseRupiahToNumber(hargaInput.value);

    // VALIDASI: Hanya tolak jika harga kurang dari 0 atau bukan angka sama sekali
    if (isNaN(hargaNum) || hargaNum < 0 || hargaInput.value === "") {
      showToast('Input harga tidak valid', 'err');
      hargaInput.focus();
      return;
    }

    const qty = parseInt(document.getElementById('prodQty').value) || 1;
    const diskon = parseFloat(document.getElementById('prodDiskon').value) || 0;
    const subtotal = hargaNum * qty;
    const total = subtotal - (subtotal * (diskon / 100));

    const item = {
      estate: estate,
      kode: document.getElementById('kodeProduk').value,
      nama: produkSelect.options[produkSelect.selectedIndex].text,
      qty: qty,
      harga: hargaNum,
      diskon: diskon,
      total: total
    };

    getState().cart.push(item);
    renderCart();
    showToast('Item ditambahkan' + (hargaNum === 0 ? ' (FREE)' : ''), 'ok');

    // Reset Form Produk
    produkSelect.value = '';
    document.getElementById('kodeProduk').value = '';
    hargaInput.value = '';
    hargaInput.setAttribute('readonly', true);
    document.getElementById('prodQty').value = '1';
    document.getElementById('prodDiskon').value = '0';
  }

  function renderCart() {
  const container = document.getElementById('cartContainer');
  const cart = getState().cart || [];
  let grandTotal = 0;

  if (cart.length === 0) {
    container.innerHTML = '<p style="padding:20px; color:#999; text-align:center;">Belum ada item di keranjang.</p>';
    document.getElementById('cartSubtotal').textContent = 'Rp 0';
    if (typeof updatePaymentSummaryUI === 'function') updatePaymentSummaryUI();
    return;
  }

  // HEADER TABEL (Menambahkan Kolom DISKON)
  let html = '<table style="width:100%; border-collapse:collapse; font-size:13px;">';
  html += `<thead style="background:#f8fafc; position:sticky; top:0; z-index:10;">
            <tr>
              <th style="padding:12px 10px; text-align:left;">PRODUK</th>
              <th style="padding:12px 10px; text-align:center;">QTY</th>
              <th style="padding:12px 10px; text-align:right;">HARGA</th>
              <th style="padding:12px 10px; text-align:center;">DISKON</th>
              <th style="padding:12px 10px; text-align:right;">TOTAL</th>
              <th style="padding:12px 10px; text-align:center;">AKSI</th>
            </tr>
          </thead><tbody>`;

  cart.forEach((item, index) => {
    grandTotal += item.total;
    
    // Logika tampilan diskon: Jika 0 tampilkan "-", jika ada tampilkan angkanya + %
    const diskonDisplay = item.diskon > 0 ? `<span style="color:#ef4444; font-weight:600;">${item.diskon}%</span>` : '<span style="color:#94a3b8;">-</span>';

    html += `<tr style="border-bottom:1px solid #f1f5f9;">
      <td style="padding:10px;">
        <div style="font-weight:600; color:#1e293b;">${item.nama}</div>
        <div style="font-size:11px; color:#64748b;">${item.kode}</div>
      </td>
      <td style="padding:10px; text-align:center;">${item.qty}</td>
      <td style="padding:10px; text-align:right;">
        ${item.harga === 0 ? '<span style="color:#10b981;font-weight:bold;">FREE</span>' : formatRupiah(item.harga)}
      </td>
      
      <!-- KOLOM DISKON BARU -->
      <td style="padding:10px; text-align:center;">${diskonDisplay}</td>
      
      <td style="padding:10px; text-align:right; font-weight:700; color:#0f172a;">
        ${item.total === 0 ? '<span style="color:#10b981;">Rp 0</span>' : formatRupiah(item.total)}
      </td>
      <td style="padding:10px; text-align:center;">
        <button type="button" onclick="removeCartItem(${index})" 
                style="background:#fee2e2; border:none; color:#ef4444; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:700;">
          Hapus
        </button>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
  
  // Update Subtotal di bawah tabel
  document.getElementById('cartSubtotal').textContent = formatRupiah(grandTotal);
  
  // Update section Pembayaran (DP, Pelunasan, Sisa)
  if (typeof updatePaymentSummaryUI === 'function') updatePaymentSummaryUI();
}

  function removeCartItem(index) {
    getState().cart.splice(index, 1);
    renderCart();
  }
</script>
