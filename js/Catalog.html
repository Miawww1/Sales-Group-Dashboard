<script>
  /************************************************************
   *  CATALOG.JS - Support Harga Free (-) jadi 0
   ************************************************************/

  function switchCategory(category, btn) {
    getState().selectedCategory = category;
    document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active'));
    if (btn) btn.classList.add('active');
    loadCatalog();
  }

  function loadCatalog() {
    const estate = document.getElementById('estate').value;
    const category = getState().selectedCategory || 'Wisata';
    const produkSelect = document.getElementById('produkSelect');
    if (!estate) {
      produkSelect.innerHTML = '<option value="">Pilih Estate dulu</option>';
      return;
    }

    toggleLoading(true, 'Memuat produk...');
    runServer()
      .withSuccessHandler(function(items) {
        toggleLoading(false);
        produkSelect.innerHTML = '<option value="">Pilih Produk</option>';
        if (items && items.length > 0) {
          items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.kode;
            opt.textContent = item.nama;
            opt.dataset.harga = item.harga;
            opt.dataset.kode = item.kode;
            produkSelect.appendChild(opt);
          });
        } else {
          produkSelect.innerHTML = '<option value="">Tidak ada produk</option>';
        }
      })
      .withFailureHandler(err => { toggleLoading(false); showToast('Gagal muat', 'err'); })
      .listCatalog(category, estate);
  }

  document.getElementById('produkSelect').addEventListener('change', function() {
    const selected = this.options[this.selectedIndex];
    const hargaInput = document.getElementById('prodHarga');
    const kodeInput = document.getElementById('kodeProduk');

    if (selected && selected.value) {
      let hargaDb = String(selected.dataset.harga || '').trim();
      kodeInput.value = selected.dataset.kode;

      // Harga produk sekarang SELALU bisa diedit manual di semua Estate
      // (harga suka berubah-ubah, jadi sales bisa update sendiri kalau
      // katalog belum sempat di-update).
      hargaInput.readOnly = false;
      hargaInput.style.background = "#ffffff"; // Latar putih (menandakan bisa diisi)
      hargaInput.style.border = "2px solid #593E26"; // Beri border biru agar mencolok

      // Kalau harga di DB kosong/strip/0, mulai dari "0"; kalau ada, tampilkan
      // harga dari katalog sebagai nilai awal (tetap bisa diedit).
      if (hargaDb === "-" || hargaDb === "0" || hargaDb === "" || hargaDb === "NaN") {
        hargaInput.value = "0";
      } else {
        hargaInput.value = formatRupiah(hargaDb);
      }
    } else {
      // Reset jika tidak ada produk yang dipilih
      kodeInput.value = '';
      hargaInput.value = '';
      hargaInput.readOnly = false;
      hargaInput.style.background = "#ffffff";
    }
  });
</script>
