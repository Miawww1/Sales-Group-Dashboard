<script>
  /************************************************************
   *  FORMHANDLER.JS - Manajemen Form & Pengiriman Data
   ************************************************************/

  /**
   * Inisialisasi awal saat Dashboard terbuka
   */
  function initializeDashboard() {
    populateEstateOptions();
    populateSumberOptions();
    populateLembagaOptions();
    if (typeof loadTravelAgents === 'function') loadTravelAgents();
    if (typeof renderCart === 'function') renderCart();
    
    // Bind input pembayaran agar otomatis format Rupiah
    bindPaymentInputs();
    
    // Kunci UI jika role hanya bisa melihat
    applyRoleUiLock_();
  }

  /**
   * Mengisi pilihan Estate (CES 1 - 10)
   */
  function populateEstateOptions() {
    const sel = document.getElementById('estate');
    if (!sel) return;

    const u = getState().user;
    const all = ['CES 1','CES 2','CES 3','CES 4','CES 5','CES 6','CES 7','CES 8','CES 9','CES 10'];
    
    let list = all;
    // Jika bukan Sales/Tele, batasi sesuai regional (logika dari Utils)
    if (typeof canInputRole_ === 'function' && !canInputRole_(u.jabatan)) {
      if (typeof getEstateAllowedByRegional_ === 'function') {
        list = getEstateAllowedByRegional_(u.regional);
      }
    }

    sel.innerHTML = '<option value="">Pilih Estate</option>' + 
      list.map(e => `<option value="${e}">${e}</option>`).join('');
  }

  /**
   * Mengisi pilihan Sumber berdasarkan Jabatan (Logika Asli Arrafi)
   */
  function populateSumberOptions() {
    const sel = document.getElementById('sumber');
    if (!sel) return;

    const jab = String(getState()?.user?.jabatan || '').toLowerCase();
    let list = [];

    if (jab === 'sales') {
      list = ['Canvassing', 'Canvassing CMD', 'Follow Up (Estate)'];
    } else if (jab === 'telemarketing') {
      list = ['Instagram', 'Instagram Ads', 'Facebook Ads', 'Qontak', 'Outbound'];
    } else {
      list = ['Canvassing', 'Instagram', 'Outbound', 'Walk-in', 'Lainnya'];
    }

    sel.innerHTML = '<option value="">Pilih Sumber</option>' + 
      list.map(s => `<option value="${s}">${s}</option>`).join('');
  }

  /**
   * Mengisi pilihan Lembaga berdasarkan Jabatan (Logika Asli Arrafi)
   */
  function populateLembagaOptions() {
    const sel = document.getElementById('lembaga');
    if (!sel) return;

    const jab = String(getState()?.user?.jabatan || '').toLowerCase();
    let list = [];

    if (jab === 'sales') {
      list = ['Sekolah', 'Komunitas', 'Perusahaan', 'Pemerintahan'];
    } else if (jab === 'telemarketing') {
      list = ['Sekolah', 'Komunitas (Leader Edu)', 'Komunitas (Leader Corpo)', 'Perusahaan', 'Pemerintahan'];
    } else {
      list = ['Sekolah', 'Perusahaan', 'Komunitas', 'Pemerintahan', 'Lainnya'];
    }

    sel.innerHTML = '<option value="">Pilih Lembaga</option>' + 
      list.map(l => `<option value="${l}">${l}</option>`).join('');
  }

  /**
   * Format otomatis saat mengetik di field DP/Pelunasan
   */
  function bindPaymentInputs() {
    ['dp1', 'pelunasan'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.onblur = (e) => {
        const val = parseRupiahToNumber(e.target.value);
        e.target.value = val > 0 ? formatRupiah(val) : '';
        if (typeof updatePaymentSummaryUI === 'function') updatePaymentSummaryUI();
      };
    });
  }

  /**
   * HANDLE SUBMIT - SIMPAN / UPDATE
   */
  document.getElementById('inputForm').onsubmit = (e) => {
    e.preventDefault();
    const S = getState();

    if (!S.cart || S.cart.length === 0) {
      showToast('Keranjang belanja masih kosong!', 'err');
      return;
    }

    const isEdit = S.editMode;
    const msgLoading = isEdit ? 'Memperbarui Data...' : 'Menyimpan Data...';
    
    // 1. Tampilkan Loading (Kunci Layar)
    toggleLoading(true, msgLoading);

    const formData = collectFormData();

    const run = runServer().withSuccessHandler(res => {
      // 2. Matikan Loading
      toggleLoading(false);

      if (res.success) {
        showToast(res.message, 'ok');
        resetForm();
        if (isEdit) {
          S.editMode = false;
          S.editOrderId = null;
        }
        // Refresh tabel summary jika user sedang di halaman revenue
        if (typeof loadRevenueSummary === 'function') loadRevenueSummary(1);
      } else {
        showToast(res.message, 'err');
      }
    }).withFailureHandler(err => {
      toggleLoading(false);
      showToast('Error Server: ' + err, 'err');
    });

    if (isEdit) {
      run.updateOrderWithItems(S.editOrderId, formData, S.cart, S.user.email);
    } else {
      run.saveOrderWithItems(formData, S.cart, S.user);
    }
  };

  /**
   * Kunci Form jika jabatan tidak boleh input
   */
  function applyRoleUiLock_() {
    if (typeof canInputRole_ !== 'function') return;
    const can = canInputRole_(getState().user.jabatan);
    if (!can) {
      const form = document.getElementById('inputForm');
      form.querySelectorAll('input, select, button').forEach(el => {
        if (el.type !== 'button') el.disabled = true;
      });
      // Sembunyikan tombol simpan
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.style.display = 'none';
      
      showToast('Mode Lihat: Anda tidak diizinkan membuat data.', 'ok');
    }
  }

  /**
   * Mengambil data dari elemen-elemen form
   */
  function collectFormData() {
    const S = getState();
    return {
      estate: document.getElementById('estate').value,
      status: document.getElementById('status').value,
      eventDate: document.getElementById('eventDate').value,
      jamKedatangan: document.getElementById('jamKedatangan').value,
      namaPIC: document.getElementById('namaPIC').value,
      noTelp: document.getElementById('noTelp').value,
      namaGrup: document.getElementById('namaGrup').value,
      lembaga: document.getElementById('lembaga').value,
      sumber: document.getElementById('sumber').value,
      isTravelAgent: document.getElementById('isTravelAgent').checked,
      travelAgentKode: S.selectedTravelAgent?.kode || '',
      travelAgentNama: S.selectedTravelAgent?.nama || '',
      dp1: parseRupiahToNumber(document.getElementById('dp1').value),
      tanggalDP: document.getElementById('dp1Date').value,
      pelunasan: parseRupiahToNumber(document.getElementById('pelunasan').value),
      tanggalPelunasan: document.getElementById('pelunasanDate').value
    };
  }

  /**
   * Meriset isi Form ke semula
   */
  function resetForm() {
    document.getElementById('inputForm').reset();
    const S = getState();
    S.cart = [];
    S.selectedTravelAgent = null;
    S.editMode = false;
    S.editOrderId = null;

    if (typeof renderCart === 'function') renderCart();
    if (typeof updatePaymentSummaryUI === 'function') updatePaymentSummaryUI();
    if (typeof toggleTravelAgentSection === 'function') toggleTravelAgentSection();
    
    // Kembalikan tombol simpan jika sebelumnya di-hide
    const submitBtn = document.querySelector('#inputForm button[type="submit"]');
    if (submitBtn) submitBtn.style.display = 'inline-flex';
    
    showToast('Form telah dibersihkan', 'ok');
  }
</script>
