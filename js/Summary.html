<script>
  /************************************************************
   *  SUMMARY.JS - FIXED (Pagination & Data Recovery)
   ************************************************************/

  let currentRevPage = 1;

  function initRevenueDates() {
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - 14); 

    const formatDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const startInput = document.getElementById('revStartDate');
    const endInput = document.getElementById('revEndDate');
    
    if (startInput && !startInput.value) startInput.value = formatDate(start);
    if (endInput && !endInput.value) endInput.value = formatDate(end);
  }

  function openRevenuePage() {
    const inputCard = document.getElementById('inputCard');
    const revenuePage = document.getElementById('revenuePage');
    if (inputCard) inputCard.classList.add('hidden');
    if (revenuePage) revenuePage.classList.remove('hidden');
    
    initRevenueDates(); 
    loadRevenueSummary(1);
  }

  function backToInputPage() {
    const inputCard = document.getElementById('inputCard');
    const revenuePage = document.getElementById('revenuePage');
    if (inputCard) inputCard.classList.remove('hidden');
    if (revenuePage) revenuePage.classList.add('hidden');
  }

  function loadRevenueSummary(page = 1) {
  const user = getState().user;
  if (!user?.email) return;

  currentRevPage = page;
  const startDate = document.getElementById('revStartDate').value;
  const endDate = document.getElementById('revEndDate').value;
  
  // AMBIL KATA KUNCI DARI INPUT SEARCH
  const searchQuery = document.getElementById('summarySearch').value;

  toggleLoading(true, 'Mencari data global...');

  runServer()
    .withSuccessHandler(function(res) {
      toggleLoading(false);
      getState().summaryData = res.data || [];
      renderSummaryTable(res.data);
      updatePaginationUI(res.totalRows, res.page, res.pageSize);
    })
    .withFailureHandler(err => {
      toggleLoading(false);
      showToast('Gagal memuat data', 'err');
    })
    .getRevenueSummaryForUser(user.email, {
      startDate: startDate, 
      endDate: endDate, 
      page: page, 
      pageSize: 50,
      search: searchQuery // KIRIM KE SERVER
    });
}

  function renderSummaryTable(data) {
    const tbody = document.querySelector('#revenueTable tbody');
    if (!tbody) return;
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#94a3b8;">Tidak ada data ditemukan</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(r => `
      <tr>
        <td>${r.estate}</td>
        <td>${r.namaGrup}</td>
        <td><span style="font-weight:700; color:${r.status === 'Lost' ? '#ef4444' : '#2563eb'}">${r.status}</span></td>
        <td style="text-align:right;">${formatRupiah(r.totalRevenue)}</td>
        <td style="text-align:center;">
          <div style="display:flex; gap:5px; justify-content:center;">
            <button type="button" onclick="editSummaryById('${r.orderId}')" class="btn-primary" style="width:auto; padding:5px 12px; font-size:11px; margin:0;">Edit</button>
            <button type="button" onclick="deleteSummaryById('${r.orderId}')" class="btn-primary" style="width:auto; padding:5px 12px; font-size:11px; background:#ef4444; margin:0;">Hapus</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function updatePaginationUI(totalRows, currentPage, pageSize) {
    const totalPages = Math.ceil(totalRows / pageSize) || 1;
    const info = document.getElementById('pageInfo');
    if (info) info.textContent = `Halaman ${currentPage} / ${totalPages}`;
    
    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');
    
    // Matikan tombol jika sudah di ujung halaman
    if (prevBtn) prevBtn.disabled = (currentPage <= 1);
    if (nextBtn) nextBtn.disabled = (currentPage >= totalPages);
  }

  // --- LOGIKA TOMBOL NEXT & PREV ---
  document.addEventListener('DOMContentLoaded', function() {
    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (currentRevPage > 1) {
          loadRevenueSummary(currentRevPage - 1);
        }
      };
    }

    if (nextBtn) {
      nextBtn.onclick = function() {
        // Tombol Next akan memuat halaman berikutnya
        loadRevenueSummary(currentRevPage + 1);
      };
    }
  });

  window.editSummaryById = function(orderId) {
    toggleLoading(true, 'Mengambil detail order...');
    runServer()
      .withSuccessHandler(res => {
        if (res.success) {
          applyOrderDetailToForm(res.header, res.items);
        } else {
          toggleLoading(false);
          showToast('Gagal: ' + res.message, 'err');
        }
      })
      .withFailureHandler(err => {
        toggleLoading(false);
        showToast('Error Server: ' + err, 'err');
      })
      .fetchOrderDetailForEdit(orderId, getState().user.email);
  }

  function applyOrderDetailToForm(header, items) {
    try {
      backToInputPage();

      const S = getState();
      S.editMode = true;
      S.editOrderId = header.orderId;
      S.cart = Array.isArray(items) ? items : [];

      const fill = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.value = val || '';
      };

      fill('namaPIC', header.namaPIC);
      fill('noTelp', header.noTelp);
      fill('namaGrup', header.namaGrup);
      fill('eventDate', normalizeDate(header.eventDate));
      fill('jamKedatangan', normalizeTime(header.jamKedatangan));
      
      fill('dp1', formatRupiah(header.dp1 || 0));
      fill('dp1Date', normalizeDate(header.tanggalDP));
      fill('pelunasan', formatRupiah(header.pelunasan || 0));
      fill('pelunasanDate', normalizeDate(header.tanggalPelunasan));

      if (typeof populateEstateOptions === 'function') populateEstateOptions();
      if (typeof populateSumberOptions === 'function') populateSumberOptions();
      if (typeof populateLembagaOptions === 'function') populateLembagaOptions();
      if (typeof renderCart === 'function') renderCart();

      setTimeout(() => {
        try {
          fill('estate', header.estate);
          fill('sumber', header.sumber);
          fill('lembaga', header.lembaga);

          const statusEl = document.getElementById('status');
          if (statusEl) {
            const isRes = String(header.status).toLowerCase() === 'reservasi';
            if (isRes) {
              statusEl.innerHTML = '<option value="Reservasi">Reservasi</option><option value="Lost">Lost</option>';
            } else {
              statusEl.innerHTML = '<option value="On Nego">On Nego</option><option value="Booked">Booked</option><option value="Lost">Lost</option>';
            }
            statusEl.value = header.status;
          }

          const taCheck = document.getElementById('isTravelAgent');
          if (taCheck) {
            taCheck.checked = header.isTravelAgent;
            if (header.isTravelAgent) {
              S.selectedTravelAgent = { kode: header.travelAgentKode, nama: header.travelAgentNama };
            }
            if (typeof toggleTravelAgentSection === 'function') toggleTravelAgentSection();
          }

          if (typeof updatePaymentSummaryUI === 'function') updatePaymentSummaryUI();
          
          toggleLoading(false);
          showToast("Data Dimuat", "ok");
        } catch (e) {
          console.error(e);
          toggleLoading(false);
        }
      }, 500);

    } catch (err) {
      console.error(err);
      toggleLoading(false);
      alert("Gagal memuat data ke form: " + err.message);
    }
  }

  window.deleteSummaryById = function(orderId) {
    if (!confirm('Yakin ingin menghapus order ini?')) return;
    toggleLoading(true, 'Menghapus data...');
    runServer().withSuccessHandler(res => {
      toggleLoading(false);
      if (res.success) {
        showToast(res.message, 'ok');
        loadRevenueSummary(currentRevPage);
      } else {
        showToast(res.message, 'err');
      }
    }).deleteOrderById(orderId, getState().user.email);
  }

  function handleLocalSearch(event) {
  // Jika user tekan Enter, langsung cari
  if (event && event.key === "Enter") {
    loadRevenueSummary(1);
    return;
  }
  
  // Debounce: Tunggu user berhenti mengetik selama 500ms baru cari ke server
  clearTimeout(window.searchTimeout);
  window.searchTimeout = setTimeout(() => {
    loadRevenueSummary(1); // Reset ke halaman 1 setiap kali search
  }, 700);
}
</script>
